<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ИИ Дневник Сушки</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121214; color: #ffffff; display: flex; flex-direction: column; height: 100vh; }
        header { background-color: #1a1a1e; padding: 15px; text-align: center; font-size: 1.2rem; font-weight: bold; border-bottom: 1px solid #29292e; color: #a370f7; }
        #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 75%; padding: 12px 16px; border-radius: 16px; font-size: 0.95rem; line-height: 1.4; }
        .user-message { background-color: #a370f7; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
        .ai-message { background-color: #1a1a1e; color: #e1e1e6; align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid #29292e; }
        #input-container { background-color: #1a1a1e; padding: 15px; display: flex; gap: 10px; border-top: 1px solid #29292e; }
        #message-input { flex: 1; background-color: #29292e; border: 1px solid #3e3e4a; border-radius: 24px; padding: 12px 20px; color: white; font-size: 1rem; outline: none; }
        #send-btn { background-color: #a370f7; border: none; border-radius: 50%; width: 48px; height: 48px; color: white; font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <header>ИИ Куратор: Неделя 6</header>
    <div id="chat-container">
        <div class="message ai-message">Привет, Андрей! Твой профиль ЖКТ загружен, вес 89,55 кг зафиксирован. Что ты съел или какую активность выполнил?</div>
    </div>
    <div id="input-container">
        <input type="text" id="message-input" placeholder="Введите обед или тренировку..." autocomplete="off">
        <button id="send-btn">✈️</button>
    </div>

    <script>
        // Твоя ПУБЛИЧНАЯ рабочая ссылка от Vercel с обработчиком
        const GEMINI_URL = "https://ai-diary-6822h6yio-dempir.vercel.app/";

        const chatContainer = document.getElementById('chat-container');
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');

        function appendMessage(text, isUser) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', isUser ? 'user-message' : 'ai-message');
            msgDiv.innerText = text;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return msgDiv;
        }

        async function sendMessageToGemini(userText) {
            const loadingMsg = appendMessage("Куратор думает...", false);
            try {
                const response = await fetch(GEMINI_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: userText })
                });

                const data = await response.json();
                chatContainer.removeChild(loadingMsg);
                appendMessage(data.text, false);
            } catch (error) {
                console.error("Ошибка:", error);
                chatContainer.removeChild(loadingMsg);
                appendMessage("Ошибка связи с сервером Vercel. Проверил консоль.", false);
            }
        }

        sendBtn.addEventListener('click', () => {
            const text = messageInput.value.trim();
            if (!text) return;
            appendMessage(text, true);
            messageInput.value = '';
            sendMessageToGemini(text);
        });
        messageInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendBtn.click(); });
    </script>
</body>
</html>
