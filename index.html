<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ИИ Дневник Сушки</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #121214;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      background-color: #1a1a1e;
      padding: 15px;
      text-align: center;
      font-size: 1.2rem;
      font-weight: bold;
      border-bottom: 1px solid #29292e;
      color: #a370f7;
    }

    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .message {
      max-width: 75%;
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 0.95rem;
      line-height: 1.4;
    }

    .user-message {
      background-color: #a370f7;
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .ai-message {
      background-color: #1a1a1e;
      color: #e1e1e6;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
      border: 1px solid #29292e;
    }

    #input-container {
      background-color: #1a1a1e;
      padding: 15px;
      display: flex;
      gap: 10px;
      border-top: 1px solid #29292e;
    }

    #message-input {
      flex: 1;
      background-color: #29292e;
      border: 1px solid #3e3e4a;
      border-radius: 24px;
      padding: 12px 20px;
      color: white;
      font-size: 1rem;
      outline: none;
    }

    #message-input::placeholder {
      color: #7c7c8a;
    }

    #send-btn {
      background-color: #a370f7;
      border: none;
      border-radius: 50%;
      width: 48px;
      height: 48px;
      color: white;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    #send-btn:hover {
      background-color: #8b5cf6;
    }
  </style>
</head>

<body>

  <header>ИИ Куратор: Неделя 6</header>

  <div id="chat-container">
    <div class="message ai-message" id="welcome-msg">Привет, Андрей! Твой профиль ЖКТ загружен, вес 89,55 кг
      зафиксирован. Что ты съел или какую активность выполнил?</div>
  </div>

  <div id="input-container">
    <input type="text" id="message-input" placeholder="Введите обед или тренировку..." autocomplete="off">
    <button id="send-btn">✈️</button>
  </div>

  <script>
    const GEMINI_API_KEY = "AIzaSyD36Z-R_Ig9ui5dYFqP8HMgKUTZidmE_4g";
    const GEMINI_URL = `https://googleapis.com{GEMINI_API_KEY}`;

    const SYSTEM_PROMPT = `Ты — персональный ИИ-дневник калорий и куратор по сушке для Андрея (30 лет, 179 см). 
        Его актуальный вес: 89,55 кг. Цель: 77-80 кг. 15 августа он улетает в Казахстан, задача сейчас — держать дефицит.
        ЖЕСТКИЕ ПРАВИЛА ЖКТ: У Андрея были сбои (спазмы, вздутие). Исключить лактозу на ночь, сырые огурцы микродозами. Тяжелую еду контролировать. При перегрузках напоминай принять 1-2 таб. Панкреатина.
        ПРАВИЛА ПОДСЧЕТА: Базовый лимит 2150 ккал, белок строго 160-180г. Если указано 'на двоих' или 'половина' — дели порцию пополам и считай только его КБЖУ.
        Отвечай четко, емко, считай КБЖУ каждого продукта и пиши итоговый статус за прием пищи. Общайся по-дружески, но профессионально.`;

    const chatContainer = document.getElementById('chat-container');
    const messageInput = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');

    function appendMessage(text, isUser) {
      const msgDiv = document.createElement('div');
      msgDiv.classList.add('message');
      msgDiv.classList.add(isUser ? 'user-message' : 'ai-message');
      msgDiv.innerText = text;
      chatContainer.appendChild(msgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      return msgDiv;
    }

    async function sendMessageToGemini(userText) {
      // Создаем заглушку ожидания
      const loadingMsg = appendMessage("Куратор думает...", false);

      try {
        const response = await fetch(GEMINI_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [{ text: `${SYSTEM_PROMPT}\n\nПользователь пишет: ${userText}` }]
            }]
          })
        });

        const data = await response.json();

        // Проверяем структуру ответа официального API Google Gemini
        if (data.candidates && data.candidates[0].content && data.candidates[0].content.parts) {
          const aiText = data.candidates[0].content.parts[0].text;
          chatContainer.removeChild(loadingMsg); // Удаляем заглушку
          appendMessage(aiText, false);          // Выводим реальный ответ ИИ
        } else {
          console.log("Ответ от API:", data);
          chatContainer.removeChild(loadingMsg);
          appendMessage("ИИ вернул пустой или некорректный ответ.", false);
        }

      } catch (error) {
        console.error("Детали ошибки:", error);
        chatContainer.removeChild(loadingMsg);
        appendMessage("Ошибка связи с ИИ. Проверь консоль браузера.", false);
      }
    }

    sendBtn.addEventListener('click', () => {
      const text = messageInput.value.trim();
      if (!text) return;

      appendMessage(text, true);
      messageInput.value = '';

      sendMessageToGemini(text);
    });

    messageInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendBtn.click();
    });
  </script>
</body>

</html>
